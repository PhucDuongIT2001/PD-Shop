<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Chi tiết sản phẩm | PD Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

<div th:replace="~{fragments/header :: header}"></div>

<main class="flex-grow container mx-auto px-4 py-8">
  <nav class="text-sm text-gray-500 mb-8 italic">
    <a href="/" class="hover:text-blue-600">Trang chủ</a> /
    <a href="/shop" class="hover:text-blue-600">Sản phẩm</a> /
    <span class="text-gray-800 font-bold">Chi tiết</span>
  </nav>

  <div class="bg-white rounded-3xl shadow-sm overflow-hidden border border-gray-100">
    <div class="flex flex-col lg:flex-row p-6 md:p-12 gap-12">

      <div class="lg:w-1/2 space-y-4">
        <div class="aspect-square bg-white rounded-2xl overflow-hidden border flex items-center justify-center p-4">
          <img src="/images/rog.jpg" class="max-w-full max-h-full object-contain" alt="Main Product Image">
        </div>

        <div class="grid grid-cols-4 gap-4">
          <div class="aspect-square bg-gray-50 rounded-xl border flex items-center justify-center p-1 hover:border-blue-600 cursor-pointer transition">
            <img src="/images/rog.jpg" class="max-w-full max-h-full object-contain">
          </div>
          <div class="aspect-square bg-gray-50 rounded-xl border flex items-center justify-center p-1 hover:border-blue-600 cursor-pointer transition">
            <img src="/images/macm1.jpg" class="max-w-full max-h-full object-contain">
          </div>
        </div>
      </div>

      <div class="lg:w-1/2 flex flex-col">
        <h1 class="text-3xl font-black text-gray-800 leading-tight mb-2">Màn Hình Chuyên Đồ Họa ASUS ProArt 4K</h1>
        <div class="flex items-center gap-4 mb-6">
          <div class="text-yellow-400 text-sm">★★★★★ <span class="text-gray-400 ml-1">(48 đánh giá)</span></div>
          <span class="text-gray-300">|</span>
          <span class="text-green-600 font-bold italic text-sm">Đang có hàng</span>
        </div>

        <div class="bg-blue-50 p-6 rounded-2xl mb-8">
          <span class="text-3xl font-black text-red-600">15.900.000đ</span>
          <span class="ml-4 text-gray-400 line-through italic text-lg">18.500.000đ</span>
        </div>

        <div class="space-y-6">
          <div>
            <span class="block text-xs font-black text-gray-500 uppercase mb-3">Màu sắc:</span>
            <div class="flex gap-4">
              <button class="w-10 h-10 rounded-full bg-slate-800 border-4 border-white ring-2 ring-blue-600"></button>
              <button class="w-10 h-10 rounded-full bg-gray-200 border-4 border-white ring-1 ring-gray-300"></button>
            </div>
          </div>

          <div>
            <span class="block text-xs font-black text-gray-500 uppercase mb-3">Kích cỡ / Cấu hình:</span>
            <div class="flex flex-wrap gap-3">
              <button class="px-6 py-2 border-2 border-blue-600 text-blue-600 rounded-xl font-bold">27 inch</button>
              <button class="px-6 py-2 border border-gray-200 text-gray-600 rounded-xl hover:border-blue-600 transition">32 inch</button>
            </div>
          </div>

          <div class="flex items-center gap-6 pt-4">
            <span class="font-bold text-gray-700">Số lượng:</span>
            <div class="flex items-center border-2 border-gray-100 rounded-xl px-2">
              <button class="w-10 h-10 flex items-center justify-center hover:text-blue-600">-</button>
              <input type="number" value="1" class="w-12 text-center font-bold bg-transparent outline-none">
              <button class="w-10 h-10 flex items-center justify-center hover:text-blue-600">+</button>
            </div>
          </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-4 mt-10">
          <button class="flex-1 bg-blue-600 text-white py-4 rounded-2xl font-black hover:bg-blue-700 shadow-lg shadow-blue-200 transition uppercase">Thêm vào giỏ</button>
          <button class="flex-1 bg-orange-500 text-white py-4 rounded-2xl font-black hover:bg-orange-600 shadow-lg shadow-orange-200 transition uppercase">Mua ngay</button>
        </div>
      </div>
    </div>

    <div class="border-t border-gray-50 bg-gray-50/50 p-6 md:p-12">
      <div class="flex gap-10 border-b border-gray-200 mb-8 font-black text-sm uppercase">
        <button class="pb-4 border-b-2 border-blue-600 text-blue-600">Mô tả chi tiết</button>
        <button class="pb-4 text-gray-400 hover:text-gray-600 transition">Thông số kỹ thuật</button>
        <button class="pb-4 text-gray-400 hover:text-gray-600 transition">Đánh giá (48)</button>
      </div>
      <div class="prose max-w-none text-gray-600 leading-loose">
        <p>Dành riêng cho sinh viên  ngành thiết kế đồ họa, màn hình ProArt mang lại độ chính xác màu sắc tuyệt đối...</p>
      </div>
    </div>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
