<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Thanh toán đơn hàng | PD Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

<div th:replace="~{fragments/header :: header}"></div>

<main class="flex-grow container mx-auto px-4 py-10">
  <div class="flex flex-col lg:flex-row gap-8">

    <div class="lg:w-2/3 bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
      <h2 class="text-2xl font-black text-gray-800 mb-8 flex items-center gap-3">
        <i class="fa-solid fa-truck-fast text-blue-600"></i> THÔNG TIN GIAO HÀNG
      </h2>

      <form class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-xs font-bold text-gray-500 mb-2 uppercase">Họ và tên</label>
            <input type="text" placeholder="Họ và tên" class="w-full border-2 border-gray-100 rounded-xl py-3 px-4 focus:border-blue-500 outline-none transition">
          </div>
          <div>
            <label class="block text-xs font-bold text-gray-500 mb-2 uppercase">Số điện thoại</label>
            <input type="tel" placeholder="0xxx xxx xxx" class="w-full border-2 border-gray-100 rounded-xl py-3 px-4 focus:border-blue-500 outline-none transition">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-500 mb-2 uppercase">Địa chỉ nhận hàng</label>
          <input type="text" placeholder="Số nhà, tên đường, phường/xã..." class="w-full border-2 border-gray-100 rounded-xl py-3 px-4 focus:border-blue-500 outline-none transition">
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-500 mb-2 uppercase">Ghi chú đơn hàng</label>
          <textarea rows="3" placeholder="Lưu ý cho người giao hàng..." class="w-full border-2 border-gray-100 rounded-xl py-3 px-4 focus:border-blue-500 outline-none transition"></textarea>
        </div>

        <h2 class="text-2xl font-black text-gray-800 pt-6 mb-6 flex items-center gap-3 border-t">
          <i class="fa-solid fa-credit-card text-blue-600"></i> PHƯƠNG THỨC THANH TOÁN
        </h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <label class="border-2 border-blue-600 bg-blue-50 p-4 rounded-2xl cursor-pointer flex items-center gap-4 relative">
            <input type="radio" name="pay" checked class="hidden">
            <i class="fa-solid fa-money-bill-1-wave text-blue-600 text-2xl"></i>
            <span class="font-bold text-gray-800">Thanh toán khi nhận hàng (COD)</span>
            <i class="fa-solid fa-circle-check absolute top-4 right-4 text-blue-600"></i>
          </label>
          <label class="border-2 border-gray-100 p-4 rounded-2xl cursor-pointer flex items-center gap-4 hover:border-blue-200 transition">
            <input type="radio" name="pay" class="hidden">
            <i class="fa-solid fa-building-columns text-gray-400 text-2xl"></i>
            <span class="font-bold text-gray-500">Chuyển khoản ngân hàng</span>
          </label>
        </div>
      </form>
    </div>

    <aside class="lg:w-1/3">
      <div class="bg-gray-900 text-white p-8 rounded-3xl shadow-xl sticky top-24">
        <h3 class="text-xl font-bold mb-6 italic text-orange-400">Tóm tắt đơn hàng</h3>
        <div class="space-y-4 mb-8">
          <div class="flex justify-between text-sm">
            <span class="text-gray-400">2 sản phẩm:</span>
            <span class="font-bold">27.500.000đ</span>
          </div>
          <div class="flex justify-between text-sm">
            <span class="text-gray-400">Phí giao hàng:</span>
            <span class="text-green-400">Miễn phí</span>
          </div>
          <div class="border-t border-gray-700 pt-4 flex justify-between items-center">
            <span class="text-lg font-bold">TỔNG CỘNG:</span>
            <span class="text-2xl font-black text-orange-500">27.500.000đ</span>
          </div>
        </div>

        <button class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-2xl font-black uppercase tracking-widest transition-all shadow-lg active:scale-95">
          XÁC NHẬN ĐẶT HÀNG
        </button>
        <p class="text-[10px] text-gray-500 mt-6 text-center italic">
          Bằng việc đặt hàng, bạn đồng ý với các Điều khoản dịch vụ của PD Shop.
        </p>
      </div>
    </aside>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
