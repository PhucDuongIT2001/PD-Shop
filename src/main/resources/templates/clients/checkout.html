<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán | PD Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-slate-50 flex flex-col min-h-screen">

<div th:replace="~{fragments/header :: header}"></div>

<main class="flex-grow container mx-auto px-4 py-16">
    <div class="flex flex-col lg:flex-row gap-12">

        <div class="lg:w-2/3 bg-white p-10 md:p-14 rounded-[3rem] shadow-sm border border-gray-100">
            <h2 class="text-3xl font-black text-gray-900 mb-12 flex items-center gap-5">
                <i class="fa-solid fa-truck-fast text-blue-600"></i> CHI TIẾT GIAO HÀNG
            </h2>

            <form class="space-y-8">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="space-y-2">
                        <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Họ và tên người nhận</label>
                        <input type="text" placeholder="Dương Trương Duy Toàn" class="w-full bg-slate-50 border-2 border-transparent rounded-[1.2rem] py-4 px-6 focus:border-blue-500 focus:bg-white outline-none transition-all font-bold text-gray-800">
                    </div>
                    <div class="space-y-2">
                        <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Số điện thoại</label>
                        <input type="tel" placeholder="090 123 4567" class="w-full bg-slate-50 border-2 border-transparent rounded-[1.2rem] py-4 px-6 focus:border-blue-500 focus:bg-white outline-none transition-all font-bold text-gray-800">
                    </div>
                </div>

                <div class="space-y-2">
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Địa chỉ chính xác</label>
                    <input type="text" placeholder="Số nhà, tên đường, phường/xã, quận/huyện..." class="w-full bg-slate-50 border-2 border-transparent rounded-[1.2rem] py-4 px-6 focus:border-blue-500 focus:bg-white outline-none transition-all font-bold text-gray-800">
                </div>

                <div class="space-y-2">
                    <label class="block text-[10px] font-black text-gray-400 uppercase tracking-widest ml-1">Lời nhắn cho shipper</label>
                    <textarea rows="3" placeholder="Ví dụ: Giao sau giờ hành chính, gọi trước khi giao..." class="w-full bg-slate-50 border-2 border-transparent rounded-[1.2rem] py-4 px-6 focus:border-blue-500 focus:bg-white outline-none transition-all font-bold text-gray-800"></textarea>
                </div>

                <h2 class="text-3xl font-black text-gray-900 pt-10 mb-8 flex items-center gap-5 border-t border-gray-50">
                    <i class="fa-solid fa-credit-card text-blue-600"></i> THANH TOÁN
                </h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <label class="border-2 border-blue-600 bg-blue-50 p-6 rounded-[2rem] cursor-pointer flex items-center gap-6 relative shadow-lg shadow-blue-50 transition-all active:scale-95">
                        <input type="radio" name="pay" checked class="hidden">
                        <div class="w-14 h-14 bg-white rounded-2xl flex items-center justify-center shadow-sm">
                            <i class="fa-solid fa-money-bill-1-wave text-blue-600 text-2xl"></i>
                        </div>
                        <div>
                            <span class="block font-black text-gray-900 text-lg uppercase tracking-tighter">COD</span>
                            <span class="text-[10px] text-blue-600 font-bold uppercase tracking-widest">Tiền mặt khi nhận hàng</span>
                        </div>
                        <i class="fa-solid fa-circle-check absolute top-6 right-6 text-blue-600 text-xl"></i>
                    </label>

                    <label class="border-2 border-gray-50 bg-slate-50 p-6 rounded-[2rem] cursor-pointer flex items-center gap-6 relative transition-all hover:bg-white hover:border-blue-200 active:scale-95">
                        <input type="radio" name="pay" class="hidden">
                        <div class="w-14 h-14 bg-white rounded-2xl flex items-center justify-center shadow-sm">
                            <i class="fa-solid fa-building-columns text-gray-300 text-2xl"></i>
                        </div>
                        <div>
                            <span class="block font-black text-gray-400 text-lg uppercase tracking-tighter">Bank</span>
                            <span class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">Chuyển khoản online</span>
                        </div>
                    </label>
                </div>
            </form>
        </div>

        <aside class="lg:w-1/3">
            <div class="bg-gray-900 text-white p-10 rounded-[3rem] shadow-2xl sticky top-24 overflow-hidden">
                <div class="absolute -top-24 -right-24 w-64 h-64 bg-blue-600/20 rounded-full blur-3xl"></div>
                <h3 class="text-2xl font-black mb-8 italic text-orange-400 relative z-10">Tóm tắt đơn hàng</h3>
                <div class="space-y-6 mb-10 relative z-10">
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-400 font-medium">Sản phẩm (2 món):</span>
                        <span class="font-bold">27.500.000đ</span>
                    </div>
                    <div class="flex justify-between text-sm">
                        <span class="text-gray-400 font-medium">Vận chuyển:</span>
                        <span class="text-green-400 font-black italic">MIỄN PHÍ</span>
                    </div>
                    <div class="border-t border-gray-800 pt-8 flex justify-between items-end">
                        <span class="text-lg font-bold">TÀI KHOẢN CẦN TRẢ:</span>
                        <span class="text-3xl font-black text-orange-500">27.500.000đ</span>
                    </div>
                </div>

                <button class="btn-premium w-full bg-blue-600 hover:bg-blue-500 py-5 rounded-[1.5rem] font-black uppercase tracking-widest transition-all shadow-xl shadow-blue-900/50 active:scale-95 relative z-10">
                    XÁC NHẬN ĐƠN HÀNG
                </button>
                <div class="mt-8 text-center relative z-10">
                    <p class="text-[10px] text-gray-500 italic">
                        Bằng việc xác nhận, bạn đồng ý với các <a href="#" class="underline hover:text-white">Chính sách mua hàng</a> của PD-Shop.
                    </p>
                </div>
            </div>
        </aside>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
