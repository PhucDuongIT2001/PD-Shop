<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng của bạn | PD Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-slate-50 flex flex-col min-h-screen">

<div th:replace="~{fragments/header :: header}"></div>

<main class="flex-grow container mx-auto px-4 py-16">
    <div class="flex items-center gap-4 mb-10">
        <h1 class="text-4xl font-black text-gray-900 uppercase tracking-tight">Giỏ hàng</h1>
        <span class="bg-blue-600 text-white px-3 py-1 rounded-full text-xs font-bold">2 Món</span>
    </div>

    <div class="flex flex-col lg:flex-row gap-10">
        <div class="lg:w-2/3 space-y-6">
            <!-- Item 1 -->
            <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100 flex flex-col sm:flex-row items-center gap-8 group transition-all hover:border-blue-200 hover:shadow-xl hover:shadow-blue-50">
                <div class="w-32 h-32 bg-slate-50 rounded-2xl flex items-center justify-center p-4">
                    <img th:src="@{/images/rog.jpg}" class="max-w-full max-h-full object-contain group-hover:scale-110 transition duration-500">
                </div>
                <div class="flex-1 text-center sm:text-left">
                    <h3 class="font-bold text-gray-800 text-xl mb-1">Laptop Gaming ROG Strix</h3>
                    <p class="text-gray-400 text-xs font-medium uppercase tracking-widest">ASUS • RTX 3050 • 16GB RAM</p>
                    <div class="mt-4 text-blue-600 font-black text-2xl">25.000.000đ</div>
                </div>
                <div class="flex items-center bg-slate-50 rounded-2xl p-1 gap-2 border border-gray-100">
                    <button class="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-white hover:shadow-sm transition font-bold text-gray-500">-</button>
                    <input type="text" value="1" class="w-8 text-center font-black outline-none bg-transparent text-gray-800">
                    <button class="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-white hover:shadow-sm transition font-bold text-gray-500">+</button>
                </div>
                <button class="text-gray-300 hover:text-red-500 transition duration-300 p-2">
                    <i class="fa-solid fa-trash-can text-xl"></i>
                </button>
            </div>

            <!-- Item 2 -->
            <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-gray-100 flex flex-col sm:flex-row items-center gap-8 group transition-all hover:border-blue-200 hover:shadow-xl hover:shadow-blue-50">
                <div class="w-32 h-32 bg-slate-50 rounded-2xl flex items-center justify-center p-4 text-gray-400">
                    <i class="fa-solid fa-computer-mouse text-4xl"></i>
                </div>
                <div class="flex-1 text-center sm:text-left">
                    <h3 class="font-bold text-gray-800 text-xl mb-1">Chuột Logitech MX Master 3S</h3>
                    <p class="text-gray-400 text-xs font-medium uppercase tracking-widest">Logictech • Space Gray</p>
                    <div class="mt-4 text-blue-600 font-black text-2xl">2.500.000đ</div>
                </div>
                <div class="flex items-center bg-slate-50 rounded-2xl p-1 gap-2 border border-gray-100">
                    <button class="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-white hover:shadow-sm transition font-bold text-gray-500">-</button>
                    <input type="text" value="1" class="w-8 text-center font-black outline-none bg-transparent text-gray-800">
                    <button class="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-white hover:shadow-sm transition font-bold text-gray-500">+</button>
                </div>
                <button class="text-gray-300 hover:text-red-500 transition duration-300 p-2">
                    <i class="fa-solid fa-trash-can text-xl"></i>
                </button>
            </div>

            <a th:href="@{/}" class="inline-flex items-center mt-6 text-gray-500 font-bold hover:text-blue-600 transition">
                <i class="fa-solid fa-chevron-left mr-3"></i> Tiếp tục chọn thêm sản phẩm
            </a>
        </div>

        <aside class="lg:w-1/3">
            <div class="bg-white p-10 rounded-[2.5rem] shadow-xl shadow-blue-50 border border-gray-100 sticky top-24">
                <h2 class="text-2xl font-black text-gray-900 mb-8 border-b border-gray-50 pb-6 uppercase tracking-tight">Hóa đơn</h2>
                <div class="space-y-5 mb-10">
                    <div class="flex justify-between text-gray-500 font-medium">
                        <span>Tạm tính:</span>
                        <span class="text-gray-900 font-bold">27.500.000đ</span>
                    </div>
                    <div class="flex justify-between text-gray-500 font-medium">
                        <span>Phí vận chuyển:</span>
                        <span class="text-green-600 font-black italic">FREE</span>
                    </div>
                    <div class="pt-6 border-t border-gray-50 flex justify-between items-center">
                        <span class="text-lg font-black text-gray-900">TỔNG CỘNG:</span>
                        <span class="text-3xl font-black text-red-600">27.500.000đ</span>
                    </div>
                </div>

                <a th:href="@{/checkout}" class="btn-premium block w-full bg-blue-600 text-white py-5 rounded-[1.5rem] text-center font-black uppercase tracking-widest shadow-2xl shadow-blue-200 hover:scale-[1.02] active:scale-95 transition-all">
                    Thanh toán
                </a>
                <div class="mt-8 flex items-center justify-center gap-2 text-gray-400">
                    <i class="fa-solid fa-shield-halved"></i>
                    <p class="text-[10px] font-bold uppercase tracking-widest">Thanh toán an toàn 100%</p>
                </div>
            </div>
        </aside>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
