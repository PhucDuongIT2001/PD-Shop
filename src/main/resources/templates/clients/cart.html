<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Giỏ hàng của bạn | PD Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-gray-50 flex flex-col min-h-screen font-sans">

<div th:replace="~{fragments/header :: header}"></div>

<main class="flex-grow container mx-auto px-4 py-10">
  <h1 class="text-3xl font-black text-gray-800 mb-8 uppercase tracking-tight">
    Giỏ hàng <span class="text-blue-600">(2 sản phẩm)</span>
  </h1>

  <div class="flex flex-col lg:flex-row gap-8">
    <div class="lg:w-2/3 space-y-4">

      <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col sm:flex-row items-center gap-6 group transition hover:border-blue-200">
        <img src="https://via.placeholder.com/120" class="w-24 h-24 rounded-xl object-cover bg-gray-50">
        <div class="flex-1 text-center sm:text-left">
          <h3 class="font-bold text-gray-800 text-lg">Laptop Gaming ROG Strix</h3>
          <p class="text-gray-400 text-xs italic">Cấu hình: RTX 3050, 16GB RAM</p>
          <div class="mt-2 text-blue-600 font-black text-lg">25.000.000đ</div>
        </div>
        <div class="flex items-center border-2 border-gray-100 rounded-xl overflow-hidden">
          <button class="px-4 py-2 hover:bg-gray-100 transition">-</button>
          <input type="text" value="1" class="w-10 text-center font-bold outline-none bg-transparent">
          <button class="px-4 py-2 hover:bg-gray-100 transition">+</button>
        </div>
        <button class="text-gray-300 hover:text-red-500 transition duration-300">
          <i class="fa-solid fa-trash-can text-xl"></i>
        </button>
      </div>

      <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col sm:flex-row items-center gap-6 group transition hover:border-blue-200">
        <img src="https://via.placeholder.com/120" class="w-24 h-24 rounded-xl object-cover bg-gray-50">
        <div class="flex-1 text-center sm:text-left">
          <h3 class="font-bold text-gray-800 text-lg">Chuột Logitech MX Master 3S</h3>
          <p class="text-gray-400 text-xs italic">Màu sắc: Space Gray</p>
          <div class="mt-2 text-blue-600 font-black text-lg">2.500.000đ</div>
        </div>
        <div class="flex items-center border-2 border-gray-100 rounded-xl overflow-hidden">
          <button class="px-4 py-2 hover:bg-gray-100 transition">-</button>
          <input type="text" value="1" class="w-10 text-center font-bold outline-none bg-transparent">
          <button class="px-4 py-2 hover:bg-gray-100 transition">+</button>
        </div>
        <button class="text-gray-300 hover:text-red-500 transition duration-300">
          <i class="fa-solid fa-trash-can text-xl"></i>
        </button>
      </div>

      <a href="/" class="inline-block mt-4 text-blue-600 font-bold hover:underline">
        <i class="fa-solid fa-arrow-left mr-2"></i> Tiếp tục mua sắm
      </a>
    </div>

    <aside class="lg:w-1/3">
      <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100 sticky top-24">
        <h2 class="text-xl font-black text-gray-800 mb-6 border-b pb-4">TỔNG TIỀN</h2>
        <div class="space-y-4 mb-8 text-sm font-medium text-gray-600">
          <div class="flex justify-between">
            <span>Tạm tính:</span>
            <span class="text-gray-800">27.500.000đ</span>
          </div>
          <div class="flex justify-between">
            <span>Phí vận chuyển:</span>
            <span class="text-green-600 font-bold italic underline">Miễn phí</span>
          </div>
          <div class="flex justify-between text-lg font-black text-gray-900 pt-4 border-t">
            <span>THÀNH TIỀN:</span>
            <span class="text-red-600">27.500.000đ</span>
          </div>
        </div>

        <button class="w-full bg-orange-500 text-white py-4 rounded-2xl font-black hover:bg-orange-600 shadow-lg shadow-orange-100 transition uppercase tracking-widest mb-4">
          Thanh toán ngay
        </button>
        <p class="text-[10px] text-gray-400 text-center italic">Sinh viên được hỗ trợ trả góp 0% .</p>
      </div>
    </aside>
  </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
