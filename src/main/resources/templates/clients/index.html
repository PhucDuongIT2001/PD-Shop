<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang chủ | PD Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50">
<div th:replace="~{fragments/header :: header}"> </div>

<section class="container mx-auto px-4 mt-6">
  <div class="bg-blue-700 rounded-2xl p-10 text-white flex justify-between items-center">
    <div>
      <h2 class="text-4xl font-bold">Ưu đãi đồ họa 3D</h2>
      <p class="mt-2 text-blue-100">Giảm ngay 10% cho sinh viên FPT BTEC.</p>
      <button class="mt-6 bg-white text-blue-700 px-6 py-2 rounded-lg font-bold">Khám phá ngay</button>
    </div>
    <i class="fa fa-laptop-code text-8xl opacity-20"></i>
  </div>
</section>

<main class="container mx-auto px-4 py-10">
  <h3 class="text-xl font-bold mb-6 uppercase tracking-tighter text-gray-800">Sản phẩm nổi bật cho Designer</h3>

  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">

    <div th:each="p : ${productList}" class="bg-white p-4 rounded-xl shadow-sm border hover:shadow-md transition group">

      <div class="aspect-square overflow-hidden rounded-lg mb-4 bg-gray-50 flex items-center justify-center p-4">
        <img th:src="@{${p.image}}" class="max-w-full max-h-full object-contain group-hover:scale-110 transition duration-500" alt="Product Image">
      </div>

      <p th:text="${p.brand.name}" class="text-[10px] text-blue-600 font-black uppercase mb-1"></p>
      <h4 th:text="${p.name}" class="font-medium text-gray-800 line-clamp-2 h-10">Tên sản phẩm</h4>
      <p th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + 'đ'" class="text-red-600 font-bold mt-2">0đ</p>

      <a th:href="@{/product-detail}" class="block text-center mt-4 text-blue-600 text-sm font-semibold border border-blue-600 py-2 rounded-lg hover:bg-blue-600 hover:text-white transition">
        Xem chi tiết
      </a>
    </div> </div> </main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
