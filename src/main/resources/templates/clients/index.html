<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PD-Shop - Trang Chủ</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-slate-50 flex flex-col min-h-screen">
    
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="flex-grow container mx-auto px-4 py-8">
        
        <!-- Phân khu Sản phẩm: Điện thoại -->
        <section id="smartphones-section" class="mb-12 bg-white rounded-[2rem] p-8 shadow-sm border border-gray-100">
            <div th:replace="~{clients/fragments/product-section :: section(title='Điện thoại (Smartphones)', categoryId='1')}"></div>
        </section>

        <!-- Phân khu Sản phẩm: Phụ kiện -->
        <section id="accessories-section" class="mb-12 bg-white rounded-[2rem] p-8 shadow-sm border border-gray-100">
            <div th:replace="~{clients/fragments/product-section :: section(title='Phụ kiện (Accessories)', categoryId='2')}"></div>
        </section>

        <!-- Phân khu Sản phẩm: Laptop & PC -->
        <section id="laptops-pc-section" class="mb-12 bg-white rounded-[2rem] p-8 shadow-sm border border-gray-100">
            <div th:replace="~{clients/fragments/product-section :: section(title='Laptop & PC', categoryId='3')}"></div>
        </section>

        <!-- Phân khu Sản phẩm: Đồng hồ thông minh -->
        <section id="smartwatches-section" class="mb-12 bg-white rounded-[2rem] p-8 shadow-sm border border-gray-100">
            <div th:replace="~{clients/fragments/product-section :: section(title='Đồng hồ thông minh (Smartwatches)', categoryId='4')}"></div>
        </section>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="/js/script.js"></script>
</body>
</html>
