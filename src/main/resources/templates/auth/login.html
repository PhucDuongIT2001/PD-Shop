<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Đăng nhập | DP Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-100 h-screen flex items-center justify-center p-4">

<div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden border border-gray-100">
  <div class="p-8 md:p-12">
    <div class="text-center mb-10">
      <a href="/" class="text-3xl font-black text-blue-700">PD<span class="text-orange-500">SHOP</span></a>
      <p class="text-gray-400 text-sm mt-2 italic">Chào mừng bạn đến với PD Shop!</p>
    </div>

    <form class="space-y-5">
      <div>
        <label class="block text-xs font-bold text-gray-500 mb-2 uppercase">Email hoặc Tên đăng nhập</label>
        <input type="text" class="w-full border-2 border-gray-50 rounded-2xl py-3 px-4 focus:border-blue-500 outline-none transition bg-gray-50" placeholder="Vui lòng nhập Email">
      </div>
      <div>
        <div class="flex justify-between mb-2">
          <label class="text-xs font-bold text-gray-500 uppercase">Mật khẩu</label>
          <a th:href="@{/forgot-password}" class="text-xs text-blue-600 hover:underline">Quên mật khẩu?</a>
        </div>
        <input type="password" class="w-full border-2 border-gray-50 rounded-2xl py-3 px-4 focus:border-blue-500 outline-none transition bg-gray-50" placeholder="••••••••">
      </div>

      <button class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-black shadow-lg shadow-blue-100 transition-all uppercase mt-4">
        Đăng nhập
      </button>
    </form>

    <div class="mt-8 text-center">
      <p class="text-sm text-gray-500">Chưa có tài khoản?
        <a href="/register" class="text-blue-600 font-bold hover:underline">Đăng ký ngay</a>
      </p>
    </div>
  </div>
</div>

</body>
</html>
