<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Quên mật khẩu | DP Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-100 h-screen flex items-center justify-center p-4">

<div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden border border-gray-100">
  <div class="p-8 md:p-12 text-center">
    <div class="mb-6">
      <div class="w-20 h-20 bg-orange-100 rounded-full flex items-center justify-center mx-auto mb-6">
        <i class="fa-solid fa-lock-open text-3xl text-orange-500"></i>
      </div>
      <h2 class="text-2xl font-black text-gray-800 uppercase italic">Quên mật khẩu?</h2>
      <p class="text-gray-400 text-sm mt-3 px-4">Đừng lo, hãy nhập email đã đăng ký. Chúng tôi sẽ gửi hướng dẫn khôi phục mật khẩu cho bạn.</p>
    </div>

    <form class="space-y-6 text-left">
      <div>
        <label class="block text-[10px] font-black text-gray-400 uppercase mb-2 ml-1">Email khôi phục</label>
        <input type="email" class="w-full border-2 border-gray-50 rounded-2xl py-3 px-5 focus:border-orange-500 outline-none transition bg-gray-50" placeholder="nasatonytoan@gmail.com">
      </div>

      <button class="w-full bg-gray-900 hover:bg-black text-white py-4 rounded-2xl font-black shadow-lg transition-all uppercase tracking-widest">
        Gửi yêu cầu
      </button>
    </form>

    <div class="mt-8">
      <a th:href="@{/login}" class="text-sm text-gray-400 hover:text-blue-600 font-bold transition">
        <i class="fa-solid fa-arrow-left mr-2"></i> Quay lại Đăng nhập
      </a>
    </div>
  </div>
</div>

</body>
</html>
