<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Đăng ký thành viên | PD Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

<div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden border border-gray-100 my-8">
  <div class="p-8 md:p-12">
    <div class="text-center mb-8">
      <a href="/" class="text-3xl font-black text-blue-700">PD<span class="text-orange-500">SHOP</span></a>
      <p class="text-gray-400 text-sm mt-2">Công ty công nghệ</p>
    </div>

    <form class="space-y-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-[10px] font-black text-gray-400 uppercase mb-1">Họ và tên</label>
          <input type="text" class="w-full border-2 border-gray-50 rounded-xl py-2.5 px-4 focus:border-blue-500 outline-none bg-gray-50 text-sm" placeholder="Duy Toàn">
        </div>
        <div>
          <label class="block text-[10px] font-black text-gray-400 uppercase mb-1">Số điện thoại</label>
          <input type="tel" class="w-full border-2 border-gray-50 rounded-xl py-2.5 px-4 focus:border-blue-500 outline-none bg-gray-50 text-sm" placeholder="vui lòng nhập SĐT">
        </div>
      </div>

      <div>
        <label class="block text-[10px] font-black text-gray-400 uppercase mb-1">Địa chỉ Email</label>
        <input type="email" class="w-full border-2 border-gray-50 rounded-xl py-2.5 px-4 focus:border-blue-500 outline-none bg-gray-50 text-sm" placeholder="Vui lòng nhập Email">
      </div>

      <div>
        <label class="block text-[10px] font-black text-gray-400 uppercase mb-1">Mật khẩu</label>
        <input type="password" class="w-full border-2 border-gray-50 rounded-xl py-2.5 px-4 focus:border-blue-500 outline-none bg-gray-50 text-sm" placeholder="••••••••">
      </div>

      <div>
        <label class="block text-[10px] font-black text-gray-400 uppercase mb-1">Xác nhận mật khẩu</label>
        <input type="password" class="w-full border-2 border-gray-50 rounded-xl py-2.5 px-4 focus:border-blue-500 outline-none bg-gray-50 text-sm" placeholder="••••••••">
      </div>

      <div class="flex items-start gap-2 py-2">
        <input type="checkbox" class="mt-1 w-4 h-4 text-blue-600 rounded">
        <span class="text-[11px] text-gray-500 leading-tight">Tôi đồng ý với các Điều khoản dịch vụ và Chính sách bảo mật của DP Shop.</span>
      </div>

      <button class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3.5 rounded-2xl font-black shadow-lg shadow-blue-100 transition-all uppercase text-sm">
        Tạo tài khoản ngay
      </button>
    </form>

    <div class="mt-8 text-center pt-6 border-t border-gray-50">
      <p class="text-sm text-gray-500">Đã có tài khoản?
        <a th:href="@{/login}" class="text-blue-600 font-bold hover:underline">Đăng nhập</a>
      </p>
    </div>
  </div>
</div>

</body>
</html>
