<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Thông tin cá nhân | PD Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .glass-effect {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
    }
    .input-focus-glow:focus {
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4 md:p-10 font-sans">

<div class="glass-effect w-full max-w-4xl rounded-3xl shadow-2xl overflow-hidden border border-white/40 flex flex-col md:flex-row relative">
    
    <!-- Trang web Navigation/Sidebar bên trái nhẹ nhàng -->
    <div class="bg-blue-600 w-full md:w-1/3 p-10 text-white flex flex-col items-center justify-center relative overflow-hidden">
        <div class="absolute w-64 h-64 bg-white/10 rounded-full blur-3xl -top-10 -left-10"></div>
        <div class="absolute w-40 h-40 bg-orange-400/20 rounded-full blur-2xl bottom-10 right-10"></div>
        
        <div class="text-center z-10 w-full">
            <h1 class="text-3xl font-black mb-6">PD<span class="text-orange-400">SHOP</span></h1>
            
            <div class="relative w-32 h-32 mx-auto mb-4 group cursor-pointer">
                <img th:src="${profile.avatarUrl != null and !profile.avatarUrl.isEmpty() ? profile.avatarUrl : '/images/default-avatar.png'}" 
                     onerror="this.src='https://ui-avatars.com/api/?name=' + (${profile.fullName != null} ? ${profile.fullName} : 'User') + '&background=random&size=200'"
                     class="w-full h-full object-cover rounded-full border-4 border-white/30 shadow-lg group-hover:border-white transition duration-300" 
                     alt="Avatar">
                <div class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                    <i class="fas fa-camera text-xl"></i>
                </div>
            </div>
            
            <h2 class="text-2xl font-bold mb-1" th:text="${profile.fullName ?: 'Thành viên mới'}">Tên người dùng</h2>
            <p class="text-blue-200 text-sm mb-6" th:text="${profile.user != null ? profile.user.username : '@user'}">@username</p>
            
            <ul class="text-left w-full space-y-3 mt-8">
                <li><a href="/" class="flex items-center text-blue-100 hover:text-white transition group"><i class="fas fa-home w-8 group-hover:scale-110 transition"></i> Trang chủ</a></li>
                <li><a href="#" class="flex items-center text-white font-bold bg-white/10 p-2 rounded-xl"><i class="fas fa-user w-8"></i> Hồ sơ cá nhân</a></li>
                <li><a href="#" class="flex items-center text-blue-100 hover:text-white transition group p-2"><i class="fas fa-box w-8 group-hover:scale-110 transition"></i> Đơn hàng đã mua</a></li>
                <li><form th:action="@{/logout}" method="post"><button type="submit" class="flex items-center text-blue-100 hover:text-white transition group p-2 w-full text-left"><i class="fas fa-sign-out-alt w-8 group-hover:scale-110 transition"></i> Đăng xuất</button></form></li>
            </ul>
        </div>
    </div>

    <!-- Form Cập nhật -->
    <div class="w-full md:w-2/3 p-8 md:p-12 relative z-10">
        <h3 class="text-2xl font-bold text-gray-800 mb-8 border-b pb-4">Thông tin cá nhân</h3>
        
        <form th:action="@{/profile/update}" method="post" th:object="${profile}" enctype="multipart/form-data" class="space-y-6">
            
            <div class="mb-4">
                 <label class="block text-xs font-bold text-gray-500 mb-2 uppercase">Thay đổi ảnh đại diện</label>
                 <input type="file" name="avatarImage" accept="image/*" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 transition">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Họ và tên -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-2 uppercase">Họ và Tên</label>
                    <div class="relative">
                        <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" th:field="*{fullName}" class="w-full border-2 border-gray-100 rounded-2xl py-3 pl-11 pr-4 focus:border-blue-500 input-focus-glow outline-none transition bg-gray-50" placeholder="Nhập họ và tên...">
                    </div>
                </div>

                <!-- Số điện thoại -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-2 uppercase">Số điện thoại</label>
                    <div class="relative">
                        <i class="fas fa-phone absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" th:field="*{phoneContact}" class="w-full border-2 border-gray-100 rounded-2xl py-3 pl-11 pr-4 focus:border-blue-500 input-focus-glow outline-none transition bg-gray-50" placeholder="09xx xxx xxx">
                    </div>
                </div>

                <!-- Giới tính -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-2 uppercase">Giới tính</label>
                    <div class="relative">
                        <i class="fas fa-venus-mars absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <select th:field="*{gender}" class="w-full border-2 border-gray-100 rounded-2xl py-3 pl-11 pr-4 focus:border-blue-500 input-focus-glow outline-none transition bg-gray-50 appearance-none">
                            <option value="">Chọn giới tính</option>
                            <option value="Nam">Nam</option>
                            <option value="Nữ">Nữ</option>
                            <option value="Khác">Khác</option>
                        </select>
                        <i class="fas fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 text-xs pointer-events-none"></i>
                    </div>
                </div>

                <!-- Ngày sinh -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-2 uppercase">Ngày sinh</label>
                    <div class="relative">
                        <input type="date" th:field="*{dob}" class="w-full border-2 border-gray-100 rounded-2xl py-3 px-4 focus:border-blue-500 input-focus-glow outline-none transition bg-gray-50 text-gray-600">
                    </div>
                </div>
            </div>

            <!-- Địa chỉ đầy đủ -->
            <div>
                <label class="block text-xs font-bold text-gray-500 mb-2 uppercase">Địa chỉ nhận hàng mặc định</label>
                <div class="relative">
                    <i class="fas fa-map-marker-alt absolute left-4 top-4 text-gray-400 mt-1"></i>
                    <textarea th:field="*{address}" rows="3" class="w-full border-2 border-gray-100 rounded-2xl py-3 pl-11 pr-4 focus:border-blue-500 input-focus-glow outline-none transition bg-gray-50 resize-none" placeholder="Số nhà, đường, phường, quận, thành phố..."></textarea>
                </div>
            </div>

            <!-- Nút Lưu -->
            <div class="pt-4 flex justify-end">
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 hover:-translate-y-1 text-white py-3 px-8 rounded-2xl font-black shadow-lg shadow-blue-200 transition-all uppercase flex items-center space-x-2">
                    <i class="fas fa-save"></i>
                    <span>Lưu Thông Tin</span>
                </button>
            </div>
            
            <p class="text-center text-xs text-gray-400 mt-6">
                Cập nhật lần cuối: <span th:text="${#temporals.format(profile.updatedAt, 'dd/MM/yyyy HH:mm')} ?: 'Chưa có thông tin'"></span>
            </p>
        </form>
    </div>
</div>

</body>
</html>
