# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true
  forward-headers-strategy: framework

# Spring General Configuration
spring:
  config:
    import: optional:file:.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    # Let Hibernate manage the schema automatically
    hibernate:
      ddl-auto: update # Use 'update' for dev. It will create/update tables based on entities.
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  # Security OAuth2 Configuration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            scope:
              - email
              - profile

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  # Mail Configuration
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:default_email@gmail.com}
    password: ${MAIL_PASSWORD:default_password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Custom Application Properties
file:
  upload-dir: ${UPLOAD_DIR:uploads}

pdshop:
  app:
    jwtSecret: ${JWT_SECRET:default_jwt_super_secret_key_1234567890!}
    jwtExpirationMs: ${JWT_EXPIRATION_MS:86400000}

# VNPAY Payment Gateway Configuration (Sandbox)
vnpay:
  tmn-code: ${VNPAY_TMN_CODE:default_tmn}
  hash-secret: ${VNPAY_HASH_SECRET:default_hash}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  ipn-url: ${VNPAY_IPN_URL:http://localhost:8080/api/payment/vnpay/ipn}
  return-url: ${VNPAY_RETURN_URL:http://localhost:8080/order/checkout/vnpay/return}
  version: "2.1.0"
  command: "pay"
  curr-code: "VND"
  locale: "vn"

# Logging Configuration
logging:
  file:
    name: app-debug.log
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
