# Use H2 in-memory database for the test environment
# NON_KEYWORDS=VALUE un-reserves "value" (H2 2.x reserved word) so ProductVariant.value column works
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=VALUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA & Flyway Configuration for Tests ---
# Disable Flyway for tests - let Hibernate manage the schema instead
spring.flyway.enabled=false

# Use create-drop so Hibernate creates fresh schema each test run
# (do NOT use "update" — H2's built-in USERS/ROLES catalog entries fool Hibernate into
#  skipping those table creations, causing "Table USERS not found" at runtime)
spring.jpa.hibernate.ddl-auto=create-drop

# Use H2 dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
